# Build fork engine image for HAOS (no upstream release required).
name: Fork image

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  IMAGE_TAG: fork-llm

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            name: linux-x86_64
            ha_arch: amd64
            platform: linux/amd64
          - target: aarch64-unknown-linux-musl
            name: linux-aarch64
            ha_arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: fork-${{ matrix.target }}
      - name: Build engine
        run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build UI
        working-directory: web
        run: npm ci && npm run build
      - name: Notices
        run: python3 scripts/third-party-notices.py > THIRD_PARTY
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push container
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          GHCR="ghcr.io/${owner}/klar-nlu"
          cp LICENSE docker/LICENSE
          cp THIRD_PARTY docker/THIRD_PARTY
          cp "target/${{ matrix.target }}/release/klar" docker/klar
          cp scripts/klar-entry.sh docker/klar-entry.sh
          rm -rf docker/ui
          cp -R web/dist docker/ui
          chmod +x docker/klar docker/klar-entry.sh
          image="${GHCR}-${{ matrix.ha_arch }}"
          docker buildx build --platform "${{ matrix.platform }}" --push \
            -f docker/Dockerfile \
            -t "$image:${IMAGE_TAG}" \
            -t "$image:2026.9.30-fork.9" \
            docker/
